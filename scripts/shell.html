<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#16202B" />
<title>Moje trke</title>
<style>
  :root { --page-bg: #16202B; --page-fg: #E9F0F5; }
  :root:not([data-theme="light"]) { --page-bg: #16202B; --page-fg: #E9F0F5; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page-bg: #16202B; --page-fg: #E9F0F5; }
  }
  :root[data-theme="dark"] { --page-bg: #16202B; --page-fg: #E9F0F5; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page-bg); color: var(--page-fg);
    overflow-x: hidden;
    font-family: system-ui, sans-serif;
  }
  #root { min-height: 100vh; }
  img, svg { max-width: 100%; }
  #boot-err {
    display: none; margin: 16px; padding: 14px 16px;
    border: 1px solid #D6465F; border-radius: 8px;
    background: #1E2B38; color: #E9F0F5;
    font-size: 14px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word;
  }
  #boot-err b { color: #E0A63C; }
</style>
<script>
  window.__bootErr = function (label, detail) {
    var el = document.getElementById("boot-err");
    if (!el) return;
    el.style.display = "block";
    el.textContent = "";
    var b = document.createElement("b");
    b.textContent = label;
    el.appendChild(b);
    el.appendChild(document.createTextNode("\n\n" + (detail || "")));
  };
  window.addEventListener("error", function (e) {
    window.__bootErr("Greška pri pokretanju:", (e.message || "") + "\n" + (e.filename || "") + ":" + (e.lineno || ""));
  });

  /* Per-viewer convenience storage over localStorage, guarded so a blocked
     or full store degrades to the app's own "storage off" banner. */
  window.storage = {
    async get(key) {
      var v = null;
      try { v = localStorage.getItem(key); } catch (e) { throw new Error("Storage unavailable"); }
      if (v === null) throw new Error("Key not found: " + key);
      return { key: key, value: v, shared: false };
    },
    async set(key, value) {
      try { localStorage.setItem(key, value); }
      catch (e) { throw new Error("Storage write failed"); }
      return { key: key, value: value, shared: false };
    },
    async delete(key) {
      try { localStorage.removeItem(key); } catch (e) { throw new Error("Storage unavailable"); }
      return { key: key, deleted: true, shared: false };
    },
    async list(prefix) {
      var keys = [];
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (!prefix || (k && k.indexOf(prefix) === 0)) keys.push(k);
        }
      } catch (e) { throw new Error("Storage unavailable"); }
      return { keys: keys, prefix: prefix, shared: false };
    }
  };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script>
  if (!window.React) {
    document.write('<scr' + 'ipt src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"><\/scr' + 'ipt>');
  }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
  if (!window.ReactDOM) {
    document.write('<scr' + 'ipt src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"><\/scr' + 'ipt>');
  }
</script>
</head>
<body>
<div id="boot-err"></div>
<div id="root"></div>
<script>
if (!window.React || !window.ReactDOM) {
  window.__bootErr(
    "React se nije učitao.",
    "React: " + (window.React ? "OK" : "nedostaje") +
    "\nReactDOM: " + (window.ReactDOM ? "OK" : "nedostaje") +
    "\n\nSkripte sa cdnjs i jsdelivr su blokirane u ovom prikazu."
  );
} else try {
<!--APP-->
} catch (e) {
  window.__bootErr("Aplikacija je pukla pri pokretanju:", (e && e.stack) ? e.stack : String(e));
}
</script>
</body>
</html>
