# Pravi APK za Android na GitHub-u — ništa ne treba instalirati na računar.
#
# Pokreće se samo kad pošalješ izmene (push) ili ručno: Actions → "Android APK" → Run workflow.
# Gotov APK: Releases (desno na stranici repozitorijuma) → najnovije izdanje → moje-trke.apk.
#
# Potpis: ako su u Settings → Secrets and variables → Actions upisana 4 tajna podatka
# (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD),
# APK se potpisuje uvek istim ključem, pa se nova verzija instalira preko stare i podaci ostaju.
# Bez njih se pravi debug APK — svaka nova verzija tada traži deinstalaciju stare.

name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "moje-trke.jsx"
      - "data/**"
      - "scripts/**"
      - "assets/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: npm install
        run: npm install --no-audit --no-fund

      - name: Web deo (www/index.html, radi bez interneta)
        run: npm run build:android

      - name: Android projekat, ikonice i splash
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          mkdir -p android/app/src/main/res/drawable
          cp assets/android/ic_stat_trke.png android/app/src/main/res/drawable/ic_stat_trke.png
          npx cap sync android

      - name: Verzija ${{ env.VERSION_NAME }}
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/; s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Potpisani APK
        if: env.HAS_KEY == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KS" | base64 -d > "$RUNNER_TEMP/trke.jks"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/trke.jks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out "$GITHUB_WORKSPACE/moje-trke.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$GITHUB_WORKSPACE/moje-trke.apk"
          rm -f "$RUNNER_TEMP/trke.jks"

      - name: Debug APK (nema ključa u Secrets)
        if: env.HAS_KEY != 'true'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/moje-trke.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: moje-trke-${{ env.VERSION_NAME }}
          path: moje-trke.apk

      - name: Izdanje na GitHub-u (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Moje trke ${{ env.VERSION_NAME }}
          body: |
            APK za Android. Na telefonu otvori ovu stranicu, preuzmi **moje-trke.apk** i instaliraj
            (prvi put Android traži dozvolu „Instaliraj nepoznate aplikacije" za pregledač).
            ${{ env.HAS_KEY != 'true' && 'Ovo je debug verzija — pre instalacije obriši staru.' || '' }}
          files: moje-trke.apk
          make_latest: true
